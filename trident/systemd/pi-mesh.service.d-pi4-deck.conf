# pi4-deck's two differences from pi5-deck.
#
# geo.py lives in the map repo rather than in a deployed ~/src/pi-hear, because
# this deck has no voice stack to deploy one. Pointing at the checkout keeps the
# source tracked instead of leaving an untracked copy to drift.
#
# --share-position is on here and nowhere else: this deck has a u-blox receiver
# that fixes and a C6L whose Grove GPS rarely does, so it is the one host that
# knows where it is while the mesh does not. It replaces pi-gps-c6l-bridge,
# which could not run beside pi-mesh -- the bridge shelled out to the meshtastic
# CLI, and every CLI call fails while pi-mesh holds the port.
[Service]
Environment=PYTHONPATH=/home/yuiseki/src/pi-maplibre-native-slint-touch/trident/pi-hear
ExecStart=
ExecStart=/home/yuiseki/.venv-meshtastic/bin/python /usr/local/bin/pi-mesh --share-position
