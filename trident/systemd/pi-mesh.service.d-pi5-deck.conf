# pi5-deck: share this host's position with the attached C6L.
#
# There is no USB GPS receiver here, so the original reason for --share-position
# does not apply. What does apply is pi-wigle: indoors the receiver reports
# fix=0 with one satellite in view, and the only position anyone has comes from
# trilaterating the access points. pi-mesh will only pass on a position whose
# sixth field names a writer that is not itself, so turning this on cannot
# launder the node's own fix back into the node.
[Service]
Environment=PYTHONPATH=/home/yuiseki/src/pi-maplibre-native-slint-touch/trident/pi-hear
ExecStart=
ExecStart=/home/yuiseki/.venv-meshtastic/bin/python /usr/local/bin/pi-mesh --share-position
